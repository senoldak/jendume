# Yapay zekâ haber ve araştırma kaynaklarını okur, iki dilde (TR, EN) yeniden yazar ve repoya ekler.
# Zamanlama Cloudflare'deki "mecmua-saat" Worker'ındadır (İstanbul saatiyle çift saatlerde :50).
name: Haber botu

on:
  workflow_dispatch:

permissions:
  contents: write
  # Yeni haber yazıldığında "Yayınla" iş akışını başlatmak için.
  actions: write

concurrency:
  group: haber-botu
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    # Süre bütçesi yeni yazıyı ~15–18. dakikada keser; Gemini 503 beklemeleri için pay bırakılır (repo açık, dakika ücretsiz).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Motoru getir
        if: ${{ vars.MOTOR_TUR == '1' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: senoldak/mecmua
          ssh-key: '${{ secrets.MECMUA_OKUMA }}'
          path: .mecmua
          sparse-checkout: motor
          persist-credentials: false

      - name: Haberleri yaz (TR / EN)
        id: bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
          MOTOR_URL: ${{ vars.MOTOR_URL }} # Katman 3: tur başında Gemini bütçesi okunur
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
          # Resmi olmayan kaynakların şifreli listesi ve izi için (bkz. scripts/bot/gizli.mjs).
          KAYNAK_ANAHTARI: ${{ secrets.KAYNAK_ANAHTARI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Gölge denetim (20 Ekim): turda en çok bu kadar denetim kararı Gemma'ya da sorulur, yalnız loga yazılır (golge.mjs).
          GEMINI_GOLGE: ${{ vars.GEMINI_GOLGE }}
          EN_FAZLA: ${{ vars.EN_FAZLA }}
          # Ortak motor modu (private mecmua'dan salt-okur çekilir): vars.MOTOR_TUR=1 iken tur motorla sürülür.
          MOTOR_TUR: ${{ vars.MOTOR_TUR }}
          MOTOR_DIZIN: ${{ github.workspace }}/.mecmua/motor
        run: |
          if [ -z "$KAYNAK_ANAHTARI" ]; then echo "::error::KAYNAK_ANAHTARI secret'ı yok; haber kaynakları okunamaz."; exit 1; fi
          node scripts/bot/calistir.mjs

      # Bot adımı hatayla bitse de (motor modu) yazılan haberler ve gorulen.json commit edilir: defter ile repo ayrışmasın.
      # Bot adımı zaten kırmızı olduğundan iş kırmızı kalır; hiçbir şey yazılmadıysa "Değişiklik yok." ile temiz çıkar.
      # Üç aylık standartlar raporu (yol haritası madde 22): biten çeyreğin ilk 31 gününde defter sayıları bir kez
      # src/data/standartlar-raporu/<YYYY>-c<N>.json'a yazılır. Hata haber işini düşürmez.
      - name: Çeyrek standartlar raporu
        if: ${{ !cancelled() && vars.MOTOR_TUR == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
          GH_TOKEN: ${{ github.token }}
        run: node .mecmua/motor/bin/ceyrek-raporu.mjs --site jendume --dizin src/data/standartlar-raporu --kural scripts/bot/standart-kurallar.json

      - name: Commit
        id: commit
        if: ${{ !cancelled() }}
        env:
          SAYI: ${{ steps.bot.outputs.sayi || '0' }}
        run: |
          git config user.name "jendume-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/haberler scripts/bot/gorulen.json src/data/standartlar-raporu
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          if [ "$SAYI" = "0" ]; then
            git commit -m "Bot: durum güncellendi [skip ci]"
          else
            git commit -m "Bot: $SAYI yeni iki dilli haber"
            echo "yayin=1" >> "$GITHUB_OUTPUT"
          fi
          # Başka işler de depoya yazar; çakışmada yazılan haberler kaybolmasın diye 5 kez denenir.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      # Planlı (ileri tarihli) yazılar vakti gelince bu turla yayına girer: vadesi gelip sitede 404 dönen yazı varsa yayınla.
      # Standartlar: acil durdurma açıksa planlı yazı da yayına alınmaz.
      - name: Acil durdurma kontrolü
        id: dur
        if: ${{ !cancelled() && steps.commit.outputs.yayin != '1' }}
        env:
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
        run: node scripts/bot/durdu.mjs

      - name: Planlı yazılar
        id: planlagt
        if: ${{ !cancelled() && steps.commit.outputs.yayin != '1' && steps.dur.outputs.durdu != '1' }}
        run: node scripts/bot/planlagt.mjs

      # Botun push'u yayın iş akışını kendiliğinden tetiklemez (GITHUB_TOKEN); elle başlatılır.
      - name: Siteyi yayınla
        if: ${{ !cancelled() && (steps.commit.outputs.yayin == '1' || steps.planlagt.outputs.yayin == '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_ADI: ${{ github.ref_name }}
        run: gh workflow run yayinla.yml --ref "$REF_ADI"

      # Katman 0 (Gemini kota planı): bu işin Gemini kullanımını model ve amaç başına mecmua-saat'e bildirir. İşi düşürmez.
      - name: Gemini kullanımını saate bildir
        if: always()
        continue-on-error: true
        env:
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
        run: node scripts/bot/gemini-rapor.mjs jendume
