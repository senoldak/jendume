# Günlük bülten: son bültenden bu yana çıkan haberleri TR ve EN olarak tek yazıda toplar.
# Zamanlama Cloudflare'deki mecmua-saat Worker'ındadır (Türkiye saatiyle 09:00 sabah, 14:00 öğle, 21:00 akşam).
# Telegram'a yalnız bu bültenler gider (Worker'ın Telegram kuyruğu).
name: Bülten (sabah/öğle/akşam)

on:
  workflow_dispatch:
    inputs:
      donem:
        description: 'Dönem (boş bırakılırsa saate göre)'
        required: false
        default: ''
        type: choice
        options: ['', sabah, ogle, aksam]

permissions:
  contents: write
  actions: write

concurrency:
  group: haber-botu
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Bülteni yaz
        id: bulten
        env:
          DONEM: ${{ inputs.donem }}
        run: |
          case "$DONEM" in sabah|ogle|aksam|"") ;; *) DONEM="" ;; esac
          node scripts/bot/bulten.mjs $DONEM

      # Yeni bültenler de Telegram'a gider (kampanya: bulten). Anahtar yoksa atlanır; hata iş akışını bozmaz.
      - name: Telegram'a gönder
        if: steps.bulten.outputs.yazildi == '1'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_EN: ${{ secrets.TELEGRAM_CHAT_ID_EN }}
        run: node scripts/bot/telegram.mjs

      - name: Commit
        if: steps.bulten.outputs.yazildi == '1'
        run: |
          git config user.name "jendume-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/haberler
          # Telegram durum dosyası yalnız anahtar varken oluşur; yoksa commit'i bozmaz.
          if [ -f scripts/bot/telegram-durum.json ]; then git add scripts/bot/telegram-durum.json; fi
          git commit -m "Bot: bülten"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - name: Siteyi yayınla
        if: steps.bulten.outputs.yazildi == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run yayinla.yml --ref "${{ github.ref_name }}"
