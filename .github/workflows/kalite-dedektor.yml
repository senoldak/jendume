# Haftalık yapay zekâ dili ölçümü (28 Ekim 2026): son 7 günün İngilizce haberleri DeepMind'ın DetectorScope'u ile
# okunur, hangi kalıpların metni "makine yazmış gibi" gösterdiği iş özetine yazılır (scripts/kalite/dedektor.py).
# Repoya hiçbir şey yazmaz. Model ~12 GB; repo önbelleğine sığmadığı için her koşuda indirilir (haftada bir).
name: Yapay zekâ dili ölçümü

on:
  workflow_dispatch:
    inputs:
      gun:
        description: Kaç günlük haber
        default: '7'
  schedule:
    - cron: '0 6 * * 1' # pazartesi 06:00 UTC

permissions:
  contents: read

concurrency:
  group: kalite-dedektor
  cancel-in-progress: true

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Model + torch için yer: makinedeki kullanılmayan araç takımları silinir.
      - name: Disk aç
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Kur
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check 'detectorscope==0.0.1'

      - name: Ölç
        env:
          GUN: ${{ inputs.gun || '7' }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/kalite/dedektor.py "$GUN"'
