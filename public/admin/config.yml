# Sveltia CMS ayarları: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: senoldak/jendume
  branch: main

site_url: https://jendume.com
display_url: https://jendume.com
locale: tr

media_folder: /public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  - name: haberler_tr
    label: "Haberler (TR - Türkçe)"
    label_singular: "Haber (TR)"
    folder: src/content/haberler/tr
    create: true
    slug: '{{slug}}'
    summary: '{{title}} · {{date | date("DD.MM.YYYY")}}'
    fields:
      - { name: lang, label: Dil, widget: hidden, default: tr }
      - { name: title, label: Başlık, widget: string }
      - { name: description, label: Özet / Spot, widget: text }
      - name: category
        label: Kategori
        widget: select
        default: dunya
        options:
          - { label: 'Dünya & Gündem', value: dunya }
          - { label: 'Yapay Zekâ & İnsan', value: yapay-zeka }
          - { label: 'Teknoloji & Dijital Yaşam', value: teknoloji }
          - { label: 'Bilim & Keşif', value: bilim }
          - { label: 'Ekonomi & Toplum', value: ekonomi }
          - { label: 'Anlam & Perspektif', value: perspektif }
      - { name: date, label: Yayın Tarihi, widget: datetime, default: '{{now}}' }
      - { name: bolge, label: Coğrafya / Odak, widget: string, required: false }
      - { name: perspektif, label: Neden Önemli? (Kısa Anlamlandırma), widget: text, required: false }
      - { name: cover, label: Kapak Görseli, widget: image, required: false }
      - { name: coverAlt, label: Görsel Alt Metni, widget: string, required: false }
      - { name: featured, label: Manşet (Öne Çıkan), widget: boolean, default: false }
      - { name: breaking, label: Önemli Gelişme, widget: boolean, default: false }
      - { name: draft, label: Taslak, widget: boolean, default: false }
      - { name: body, label: Haber Metni, widget: markdown }

  - name: haberler_en
    label: "Stories (EN - English)"
    label_singular: "Story (EN)"
    folder: src/content/haberler/en
    create: true
    slug: '{{slug}}'
    summary: '{{title}} · {{date | date("DD.MM.YYYY")}}'
    fields:
      - { name: lang, label: Language, widget: hidden, default: en }
      - { name: title, label: Title, widget: string }
      - { name: description, label: Summary / Deck, widget: text }
      - name: category
        label: Section
        widget: select
        default: dunya
        options:
          - { label: 'World & Today', value: dunya }
          - { label: 'AI & Humanity', value: yapay-zeka }
          - { label: 'Tech & Digital Life', value: teknoloji }
          - { label: 'Science & Discovery', value: bilim }
          - { label: 'Economy & Society', value: ekonomi }
          - { label: 'Meaning & Perspective', value: perspektif }
      - { name: date, label: Publish Date, widget: datetime, default: '{{now}}' }
      - { name: bolge, label: Region / Focus, widget: string, required: false }
      - { name: perspektif, label: Why It Matters, widget: text, required: false }
      - { name: cover, label: Cover Image, widget: image, required: false }
      - { name: coverAlt, label: Cover Alt Text, widget: string, required: false }
      - { name: featured, label: Lead Story, widget: boolean, default: false }
      - { name: breaking, label: Key Development, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Story Body, widget: markdown }
